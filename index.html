<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CITEC Consulta</title>
<meta name="theme-color" content="#0e325c">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CITEC">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#14202e;--mut:#5d6b7c;--pri:#0e325c;--bd:#dde3ea;--ok:#1a7f4b;--warn:#b26a00;--bad:#b3261e;--gray:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#0f151c;--card:#18212b;--tx:#e8eef5;--mut:#9aa8b8;--pri:#7fb2ee;--bd:#2a3644;--ok:#4cc38a;--warn:#f0a84b;--bad:#f2837c;--gray:#9aa3af}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
@media(prefers-color-scheme:dark){header{background:#123a68;color:#fff}}
header h1{font-size:18px;margin:0}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px}
input[type=text],input[type=email],input[type=search]{width:100%;font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
button.pri{width:100%;margin-top:12px;font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){button.pri{color:#0f151c}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.msg{color:var(--mut);font-size:14px;margin:10px 0}.err{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:600}.sub{color:var(--mut);font-size:13px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.b-Socio{color:var(--ok)}.b-Suspendido,.b-Desafiliado{color:var(--bad)}.b-En-revisión,.b-Atención-directiva{color:var(--warn)}.b-otro{color:var(--gray)}
.fact{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);font-size:14px}
.fact .p{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media(prefers-color-scheme:dark){.chip.on{color:#0f151c}}
.hidden{display:none}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.tab{flex:1;border:0;background:transparent;color:var(--tx);padding:10px;border-radius:9px;font-size:15px;font-weight:600}
.tab.on{background:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){.tab.on{color:#0f151c}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:left;color:var(--tx);font:inherit}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--mut);font-size:13px;margin-top:4px}
.kpi.big{grid-column:1/-1}
.v-ok{color:var(--ok)}.v-warn{color:var(--warn)}.v-bad{color:var(--bad)}
h2{font-size:16px;margin:20px 0 6px}
.drow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.drow:last-child{border-bottom:0}
.ct{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.ct .who{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.ct .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ct a{display:inline-block;padding:7px 12px;border:1px solid var(--bd);border-radius:99px;color:var(--pri);text-decoration:none;font-size:14px;font-weight:600}
.hint{color:var(--mut);font-size:12px;margin-top:8px}
.card.tap{cursor:pointer}
.more{width:100%;margin-top:8px;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:18px 0}
</style>
</head>
<body>
<header><h1>CITEC · Consulta de socios</h1><button id="salir" class="hidden">Salir</button></header>
<main>
  <section id="login" class="hidden">
    <div class="card">
      <p class="name">Ingreso del personal</p>
      <p class="msg">Escribe tu correo @citec.com.ec. Te enviaremos un código de 6 dígitos.</p>
      <div id="paso1">
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="nombre@citec.com.ec">
        <button class="pri" id="enviar">Enviar código</button>
      </div>
      <div id="paso2" class="hidden">
        <input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Código">
        <button class="pri" id="verificar">Entrar</button>
      </div>
      <p id="loginmsg" class="msg"></p>
    </div>
  </section>
  <section id="app" class="hidden">
    <div class="tabs"><button class="tab on" id="tabRes">Resumen</button><button class="tab" id="tabBus">Buscar socio</button></div>
    <div id="vRes">
      <div class="kpis" id="kpis"></div>
      <h2>Últimas desafiliaciones</h2>
      <div class="chips" id="dchips"></div>
      <div class="card" id="dlista"></div>
    </div>
    <div id="vBus" class="hidden">
    <input id="q" type="search" placeholder="Buscar socio por nombre o RUC" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div id="count" class="msg"></div>
    <div id="lista"></div>
    </div>
    <p class="foot" id="actualizado"></p>
  </section>
</main>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>

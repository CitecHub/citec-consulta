<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Socios CITEC</title>
<meta name="theme-color" content="#0e325c">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Socios CITEC">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#14202e;--mut:#5d6b7c;--pri:#0e325c;--onpri:#fff;--bd:#dde3ea;--ok:#1a7f4b;--warn:#b26a00;--bad:#b3261e;--gray:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#0f151c;--card:#18212b;--tx:#e8eef5;--mut:#9aa8b8;--pri:#7fb2ee;--onpri:#0f151c;--bd:#2a3644;--ok:#4cc38a;--warn:#f0a84b;--bad:#f2837c;--gray:#9aa3af}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{background:#0e325c;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;position:relative}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:26px;width:auto;display:block}
.brand h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1 span{font-weight:400;opacity:.75}
.perfil{position:relative;flex-shrink:0}
.avatar{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.avatar svg{width:20px;height:20px}
.menu{position:absolute;right:0;top:44px;min-width:220px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;z-index:10}
.menu .mail{font-size:13px;color:var(--mut);padding:8px 10px 10px;border-bottom:1px solid var(--bd);margin-bottom:4px;word-break:break-all}
.menu button{width:100%;text-align:left;background:none;border:0;color:var(--bad);font:inherit;font-weight:600;padding:10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--bg)}
:root{--alta:#2a78d6;--baja:#d0632a}
.dash .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mov{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:left;color:var(--tx);font:inherit;position:relative;cursor:pointer}
.mov .v{font-size:28px;font-weight:700;line-height:1.1}
.mov .l{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;margin-top:4px}
.mov::after{content:"›";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--mut)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.sw.a{background:var(--alta)}.sw.b{background:var(--baja)}
.neto{font-size:14px;color:var(--mut);margin-top:10px}
.neto b{color:var(--tx)}
.pie{display:flex;justify-content:center;margin-top:14px}
.pie svg{width:190px;height:190px;display:block}
.pie .seg{cursor:pointer;transition:opacity .15s}
.pie .seg:hover{opacity:.85}
.pie text{pointer-events:none}
.pie .c1{font-size:30px;font-weight:700;fill:var(--tx)}
.pie .c2{font-size:12px;fill:var(--mut)}
.mov .p{font-size:13px;color:var(--mut);font-weight:600;margin-left:4px}
.veredicto{text-align:center;font-size:14px;font-weight:600;margin-top:12px;padding:8px 10px;border-radius:10px;background:var(--bg)}
main{max-width:720px;margin:0 auto;padding:16px}
input[type=text],input[type=email],input[type=search],select{width:100%;font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
button.pri{width:100%;margin-top:12px;font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:var(--onpri);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.msg{color:var(--mut);font-size:14px;margin:10px 0}.err{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:600}.sub{color:var(--mut);font-size:13px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.b-Activo{color:var(--ok)}.b-Suspendido,.b-Desafiliado{color:var(--bad)}.b-En-revisión,.b-Atención-directiva{color:var(--warn)}.b-otro{color:var(--gray)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.hidden{display:none!important}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:18px 0}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.tab{flex:1;border:0;background:transparent;color:var(--tx);padding:10px;border-radius:9px;font-size:15px;font-weight:600}
.tab.on{background:var(--pri);color:var(--onpri)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:left;color:var(--tx);font:inherit;position:relative}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--mut);font-size:13px;margin-top:4px}
.kpi .x{color:var(--mut);font-size:12px;margin-top:2px}
.kpi.big{grid-column:1/-1}
.kpi.go::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--mut)}
.fechaafil{font-size:14px;color:var(--tx);margin-top:6px}
.fechaclave{font-size:14px;font-weight:600;color:var(--tx);margin-top:2px}
@keyframes deslIzq{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes deslDer{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
.desl-izq{animation:deslIzq .3s cubic-bezier(.2,.8,.2,1)}.desl-der{animation:deslDer .3s cubic-bezier(.2,.8,.2,1)}
/* Respuesta visual al tocar tarjetas y botones */
.item,.drow,.kpi,.mov,.ctbtn{transition:transform .14s ease,box-shadow .14s ease,background-color .14s ease;-webkit-tap-highlight-color:transparent}
.item:active,.kpi:active,.mov:active,.ctbtn:active{transform:scale(.97);box-shadow:0 2px 10px rgba(14,50,92,.18)}
.drow:active{background-color:var(--bg)}
@media(prefers-reduced-motion:reduce){.desl-izq,.desl-der{animation:none}.item,.drow,.kpi,.mov,.ctbtn{transition:none}.item:active,.kpi:active,.mov:active,.ctbtn:active{transform:none}}
html,body{touch-action:pan-y pinch-zoom}
/* Pantalla de bienvenida al abrir la app */
.bienvenida{position:fixed;inset:0;z-index:50;background:#0e325c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;animation:bienEntra .45s ease-out;cursor:pointer}
.bienvenida img{width:84px;height:auto;margin-bottom:14px;animation:bienSube .6s cubic-bezier(.2,.8,.2,1)}
.bienvenida .bt{font-size:18px;opacity:.85;animation:bienSube .6s .08s cubic-bezier(.2,.8,.2,1) both}
.bienvenida .bn{font-size:34px;font-weight:700;line-height:1.15;animation:bienSube .6s .16s cubic-bezier(.2,.8,.2,1) both}
.bienvenida.sale{animation:bienSale .4s ease-in forwards}
@keyframes bienEntra{from{opacity:0}to{opacity:1}}
@keyframes bienSube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bienSale{to{opacity:0;transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){.bienvenida,.bienvenida img,.bienvenida .bt,.bienvenida .bn,.bienvenida.sale{animation:none}}
.v-ok{color:var(--ok)}.v-warn{color:var(--warn)}.v-bad{color:var(--bad)}
h2{font-size:16px;margin:18px 0 6px}
.back{background:none;border:0;color:var(--pri);font-size:16px;font-weight:600;padding:4px 0;margin-bottom:6px}
.item{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);cursor:pointer}
.drow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.drow:last-child{border-bottom:0}
.mrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);font:inherit;text-align:left}
.mrow:last-child{border-bottom:0}
.mrow.on{color:var(--pri);font-weight:700}
.bar{height:6px;background:var(--bad);border-radius:3px;margin-top:4px;opacity:.75}
.more{width:100%;margin-top:8px;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.big-n{font-size:30px;font-weight:700}
.fx{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.fx:last-child{border-bottom:0}
.who{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-top:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts a{display:inline-block;padding:7px 12px;border:1px solid var(--bd);border-radius:99px;color:var(--pri);text-decoration:none;font-size:14px;font-weight:600}
.ctbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;font:inherit;font-weight:600;color:var(--tx);margin-top:10px}
</style>
</head>
<body>
<div id="bienvenida" class="bienvenida hidden" role="status" aria-live="polite">
  <img src="logo-blanco.png" alt="CITEC" width="100" height="72">
  <div class="bt" id="bienTexto">Bienvenido/a</div>
  <div class="bn" id="bienNombre"></div>
</div>
<header>
  <div class="brand"><img src="logo-blanco.png" alt="CITEC" width="36" height="26"><h1>CITEC <span>·</span> Consulta de Socios</h1></div>
  <div class="perfil hidden" id="perfil">
    <button class="avatar" id="perfilBtn" aria-label="Perfil" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
    <div class="menu hidden" id="menu" role="menu"><div class="mail" id="menuMail"></div><button id="salir" role="menuitem">Cerrar sesión</button></div>
  </div>
</header>
<main>
  <section id="login" class="hidden">
    <div class="card">
      <p class="name">Ingreso del personal</p>
      <p class="msg">Escribe tu correo @citec.com.ec. Te enviaremos un código de 6 dígitos.</p>
      <div id="paso1">
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="nombre@citec.com.ec">
        <button class="pri" id="enviar">Enviar código</button>
      </div>
      <div id="paso2" class="hidden">
        <input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Código">
        <button class="pri" id="verificar">Entrar</button>
      </div>
      <p id="loginmsg" class="msg"></p>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="tabs" id="tabs"><button class="tab on" id="tabRes">Resumen</button><button class="tab" id="tabBus">Buscar socio</button></div>

    <div id="vRes">
      <div class="kpis" id="kpis"></div>
      <h2>Afiliaciones vs desafiliaciones</h2>
      <div class="card dash" id="dash">
        <select id="dashMes" aria-label="Mes de análisis"></select>
        <div class="pie" id="pie"></div>
        <div class="veredicto" id="veredicto"></div>
        <div class="duo">
          <button class="mov" id="movAlta"><div class="v"><span id="nAlta">0</span><span class="p" id="pAlta"></span></div><div class="l"><i class="sw a"></i>Socios nuevos</div></button>
          <button class="mov" id="movBaja"><div class="v"><span id="nBaja">0</span><span class="p" id="pBaja"></span></div><div class="l"><i class="sw b"></i>Desafiliados</div></button>
        </div>
      </div>
    </div>

    <div id="vMov" class="hidden">
      <button class="back" id="movBack">‹ Resumen</button>
      <h2 id="movTit"></h2>
      <div id="movLista"></div>
    </div>

    <div id="vBus" class="hidden">
      <input id="q" type="search" placeholder="Buscar por razón social o nombre comercial" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div id="count" class="msg"></div>
      <div id="lista"></div>
    </div>

    <div id="vDes" class="hidden">
      <button class="back" id="desBack">‹ Resumen</button>
      <div class="card">
        <div class="sub">Socios desafiliados</div>
        <div class="big-n" id="desTotal"></div>
        <div class="sub" id="desSub"></div>
      </div>
      <h2>Filtrar por mes</h2>
      <select id="desMes"></select>
      <h2>Desafiliaciones por mes</h2>
      <div class="card" id="desMeses"></div>
      <h2 id="desTit">Listado</h2>
      <div class="card" id="desLista"></div>
    </div>

    <div id="vDet" class="hidden">
      <button class="back" id="detBack">‹ Volver</button>
      <div id="det"></div>
    </div>

    <p class="foot" id="actualizado"></p>
  </section>
</main>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
